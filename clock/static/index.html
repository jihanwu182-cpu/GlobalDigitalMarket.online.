<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌍 Global Market Clock</h1>
            <p>Real-time display of major financial centers</p>
        </header>

        <div class="controls">
            <button id="toggle-format" class="btn">Switch to 12-Hour Format</button>
            <button id="refresh-btn" class="btn btn-primary">Refresh Now</button>
        </div>

        <div class="clocks-grid" id="clocks-container">
            <!-- Clocks will be generated by JavaScript -->
        </div>

        <footer class="footer">
            <p>Last updated: <span id="last-updated">--:--:--</span></p>
            <p>Auto-refreshing every second</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
